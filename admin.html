<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin | Portfolio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css">
  <style>
    .admin-page{min-height:100vh;padding:125px 0 70px}.admin-box{max-width:1100px;margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px}.login-box{max-width:430px;margin:45px auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.admin-head h1{font:700 28px Poppins;margin:5px 0}.admin-form{display:grid;gap:14px}.admin-form label{font-size:12px;color:var(--muted)}.admin-form input,.admin-form textarea,.admin-form select,.reply-input{display:block;width:100%;margin-top:6px;background:#0b0e18;color:#fff;border:1px solid var(--border);padding:12px;border-radius:9px;font:inherit}.admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus,.reply-input:focus{outline:2px solid #6c55ff44;border-color:#7652ff}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.admin-message{margin:15px 0;padding:12px;border-radius:9px;background:#172033;color:#aeb9d2}.admin-table{width:100%;border-collapse:collapse;margin-top:25px;font-size:12px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}.admin-table img{width:75px;height:48px;object-fit:cover;border-radius:6px;background:#0b0e18}.actions{display:flex;gap:7px;flex-wrap:wrap}.small-btn{padding:7px 10px;border:1px solid var(--border);background:#171c2b;color:#fff;border-radius:7px;font-size:11px;cursor:pointer}.small-btn:disabled{opacity:.55;cursor:wait}.reply-input{min-width:220px;min-height:95px;resize:vertical}.message-status{display:inline-block;padding:4px 8px;border-radius:99px;background:#172033;color:#aeb9d2;font-size:11px}.message-status.confirmed{background:#123a2c;color:#8ce0b1}.message-status.cancelled{background:#3a2027;color:#ffabb5}.danger{color:#ff8f9d}.admin-user{color:var(--muted);font-size:12px}.hidden{display:none!important}
    .visitor-stat{margin:18px 0 30px;padding:18px 20px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}.visitor-stat-label{color:var(--muted);font-size:12px}.visitor-stat-count{display:block;margin-top:4px;font:700 30px Poppins;color:var(--primary)}.visitor-stat-error{margin-top:8px;color:#ff9da8;font-size:12px}
    #logout{color:#21020b;background:#ff647f;border-color:#ff879b;box-shadow:0 6px 18px rgba(255,77,109,.28)}
    #logout:hover{color:#170208;background:#ff8297;box-shadow:0 9px 24px rgba(255,77,109,.42);transform:translateY(-2px)}
    #logout:focus-visible{outline:3px solid #00f3ff;outline-offset:3px}
    @media(max-width:700px){.admin-grid{grid-template-columns:1fr}.full{grid-column:auto}.admin-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header class="navbar scrolled"><div class="container nav-inner"><a class="logo" href="./index.html">&lt;Dev<span>/&gt;</span></a><a class="btn btn-secondary" href="./index.html">← Portfolio</a></div></header>
<main class="admin-page"><div class="container">
  <section id="login-section" class="admin-box login-box">
    <div class="section-heading"><p class="eyebrow">ADMIN</p><h2>Login <span>Dashboard</span></h2></div>
    <form class="admin-form" id="login-form">
      <label>Email<input id="login-email" type="email" autocomplete="username" required placeholder="email@kamu.com"></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required placeholder="Password Supabase Auth"></label>
      <button class="btn btn-primary" type="submit" id="login-button">Login</button>
    </form>
    <div id="login-message"></div>
  </section>

  <section id="dashboard-section" class="admin-box hidden">
    <div class="admin-head"><div><p class="eyebrow">ADMIN PANEL</p><h1>Project Dashboard</h1><div class="admin-user" id="logged-user"></div></div><button class="btn btn-secondary" id="logout">Logout</button></div>
    <div class="visitor-stat" aria-live="polite"><span class="visitor-stat-label">Total kunjungan website</span><strong class="visitor-stat-count" id="portfolio-visit-count">Memuat...</strong><p class="visitor-stat-error" id="visitor-stat-error"></p></div>
    <form class="admin-form" id="project-form">
      <input type="hidden" id="project-id">
      <div class="admin-grid">
        <label>Title<input id="p-title" required placeholder="Nama project"></label>
        <label>Category<select id="p-category"><option value="frontend">Frontend</option><option value="backend">Backend</option><option value="fullstack">Fullstack</option></select></label>
        <label class="full">Description<textarea id="p-description" rows="4" placeholder="Deskripsi project"></textarea></label>
        <label>Image URL<input id="p-image" placeholder="https://..."></label>
        <label>Tech Stack<input id="p-tech" placeholder="HTML, CSS, JavaScript"></label>
        <label>GitHub Link<input id="p-github" type="url" placeholder="https://github.com/..."></label>
        <label>Live Link<input id="p-live" type="url" placeholder="https://..."></label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" type="submit" id="save-project">Simpan Project</button><button class="btn btn-secondary hidden" type="button" id="cancel-edit">Batal Edit</button></div>
    </form>
    <div id="admin-message"></div>
    <div style="overflow:auto"><table class="admin-table"><thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Actions</th></tr></thead><tbody id="project-list"></tbody></table></div>
    <div class="admin-head" style="margin-top:45px"><div><p class="eyebrow">INBOX</p><h2>Pesan Masuk</h2></div></div>
    <div style="overflow:auto"><table class="admin-table"><thead><tr><th>Waktu</th><th>Pengirim</th><th>Subjek &amp; Pesan</th><th>Status</th><th>Balasan &amp; Aksi</th></tr></thead><tbody id="message-list"></tbody></table></div>
  </section>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let projects=[];const $=id=>document.getElementById(id);
function msg(t,e=false){$('admin-message').innerHTML=`<div class="admin-message" style="${e?'color:#ff9da8':''}">${esc(t)}</div>`}
async function check(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('login-section').classList.remove('hidden');$('dashboard-section').classList.add('hidden');return false;}const {data:a,error}=await supabaseClient.from('admin').select('role').eq('user_id',session.user.id).maybeSingle();if(error){await supabaseClient.auth.signOut();$('login-section').classList.remove('hidden');$('dashboard-section').classList.add('hidden');$('login-message').innerHTML=`<div class="admin-message" style="color:#ff9da8">Gagal mengecek akses admin: ${esc(error.message)}</div>`;return false;}if(!a||a.role!=='admin'){await supabaseClient.auth.signOut();$('login-section').classList.remove('hidden');$('dashboard-section').classList.add('hidden');$('login-message').innerHTML='<div class="admin-message" style="color:#ff9da8">Login berhasil, tetapi email ini belum terdaftar sebagai admin. Tambahkan user_id-nya ke tabel public.admin di Supabase.</div>';return false;}$('login-section').classList.add('hidden');$('dashboard-section').classList.remove('hidden');$('logged-user').textContent=session.user.email;load();loadMessages();loadVisitCount();return true;}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-button').disabled=true;$('login-message').innerHTML='';const email=$('login-email').value.trim().toLowerCase();const {error}=await supabaseClient.auth.signInWithPassword({email,password:$('login-password').value});$('login-button').disabled=false;if(error){const message=error.message.toLowerCase().includes('email not confirmed')?'Email belum dikonfirmasi di Supabase. Aktifkan Confirm user pada Authentication > Users.':error.message.toLowerCase().includes('invalid login credentials')?'Email atau password salah. Pastikan akun ini sudah dibuat di Authentication > Users.':error.message;$('login-message').innerHTML=`<div class="admin-message" style="color:#ff9da8">${esc(message)}</div>`;return;}await check();});
$('logout').addEventListener('click',async()=>{await supabaseClient.auth.signOut();location.reload()});
async function load(){const {data,error}=await supabaseClient.from('projects').select('*').order('created_at',{ascending:false});if(error)return msg(error.message,true);projects=data||[];$('project-list').innerHTML=projects.map(p=>`<tr><td><img src="${url(p.image_url)}"></td><td>${esc(p.title)}</td><td>${esc(p.category)}</td><td><div class="actions"><button class="small-btn" onclick="editProject('${p.id}')">Edit</button><button class="small-btn danger" onclick="deleteProject('${p.id}')">Hapus</button></div></td></tr>`).join('');}
async function loadMessages(){const {data,error}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:false});if(error)return msg(error.message,true);$('message-list').innerHTML=data?.length?data.map(m=>{const status=m.status||'pending';const label={pending:'Pending',confirmed:'Terkonfirmasi',cancelled:'Dibatalkan'}[status]||status;return `<tr><td>${esc(new Date(m.created_at).toLocaleString('id-ID'))}</td><td><strong>${esc(m.name)}</strong><br><a class="admin-user" href="mailto:${esc(m.email)}">${esc(m.email)}</a></td><td><strong>${esc(m.subject||'-')}</strong><p style="white-space:pre-line;min-width:240px">${esc(m.message)}</p>${m.reply?`<details><summary>Lihat balasan terkirim</summary><p style="white-space:pre-line">${esc(m.reply)}</p></details>`:''}</td><td><span class="message-status ${esc(status)}">${esc(label)}</span></td><td style="min-width:250px"><textarea class="reply-input" id="reply-${esc(m.id)}" maxlength="5000" placeholder="Tulis balasan untuk ${esc(m.name)}">${esc(m.reply||'')}</textarea><div class="actions"><button class="small-btn" data-message-action="confirm" data-message-id="${esc(m.id)}">Konfirmasi &amp; kirim email</button><button class="small-btn" data-message-action="pending" data-message-id="${esc(m.id)}">Pending</button><button class="small-btn danger" data-message-action="cancel" data-message-id="${esc(m.id)}">Batalkan</button></div></td></tr>`}).join(''):'<tr><td colspan="5">Belum ada pesan masuk.</td></tr>';}
async function loadVisitCount(){const count=$('portfolio-visit-count'),errorMessage=$('visitor-stat-error');const {data,error}=await supabaseClient.rpc('get_portfolio_visits');if(error){console.error('Gagal memuat jumlah kunjungan:',error);count.textContent='Tidak tersedia';errorMessage.textContent='Gagal memuat jumlah kunjungan. Jalankan SQL terbaru di Supabase lalu muat ulang halaman.';return;}if(typeof data!=='number'||!Number.isSafeInteger(data)||data<0){console.error('Respons jumlah kunjungan tidak valid:',data);count.textContent='Tidak tersedia';errorMessage.textContent='Data jumlah kunjungan tidak valid.';return;}count.textContent=new Intl.NumberFormat('id-ID').format(data);}
$('message-list').addEventListener('click',async e=>{const button=e.target.closest('button[data-message-action]');if(!button)return;const id=button.dataset.messageId,action=button.dataset.messageAction;button.disabled=true;try{if(action==='confirm'){const reply=$(`reply-${id}`).value.trim();if(!reply){msg('Tulis balasan terlebih dahulu sebelum mengonfirmasi.',true);return;}button.textContent='Mengirim email...';const {error}=await supabaseClient.functions.invoke('send-message-reply',{body:{messageId:Number(id),reply}});if(error)throw error;msg('Balasan berhasil dikirim dan pesan dikonfirmasi.');}else{const status=action==='cancel'?'cancelled':'pending';const {error}=await supabaseClient.from('messages').update({status}).eq('id',id);if(error)throw error;msg(status==='pending'?'Status pesan diubah menjadi pending.':'Pesan dibatalkan.');}await loadMessages();}catch(error){msg(`Gagal memproses pesan: ${error.message||error}`,true);}finally{button.disabled=false;}});
$('project-form').addEventListener('submit',async e=>{e.preventDefault();const id=$('project-id').value,b={title:$('p-title').value.trim(),description:$('p-description').value.trim(),image_url:$('p-image').value.trim(),tech_stack:$('p-tech').value.split(',').map(x=>x.trim()).filter(Boolean),category:$('p-category').value,github_link:$('p-github').value.trim(),live_link:$('p-live').value.trim()};const r=id?await supabaseClient.from('projects').update({...b,updated_at:new Date().toISOString()}).eq('id',id):await supabaseClient.from('projects').insert(b);if(r.error)return msg(r.error.message,true);msg(id?'Project diperbarui.':'Project ditambahkan.');resetForm();load();});
window.editProject=id=>{const p=projects.find(x=>x.id===id);if(!p)return;$('project-id').value=p.id;$('p-title').value=p.title||'';$('p-description').value=p.description||'';$('p-image').value=p.image_url||'';$('p-tech').value=(p.tech_stack||[]).join(', ');$('p-category').value=p.category||'frontend';$('p-github').value=p.github_link||'';$('p-live').value=p.live_link||'';$('cancel-edit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});};window.deleteProject=async id=>{if(!confirm('Hapus project ini?'))return;const {error}=await supabaseClient.from('projects').delete().eq('id',id);if(error)return msg(error.message,true);msg('Project berhasil dihapus.');load();};$('cancel-edit').addEventListener('click',resetForm);function resetForm(){$('project-form').reset();$('project-id').value='';$('p-category').value='frontend';$('cancel-edit').classList.add('hidden');}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function url(v){try{const u=new URL(v||'https://placehold.co/140x90');return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}check();
</script></body>
</html>
