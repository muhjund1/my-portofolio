  <main class="standalone-page">
    <section class="section section-alt" id="contact">
      <div class="container contact-grid">
        <div class="section-heading reveal">
          <p class="eyebrow">GET IN TOUCH</p>
          <h1 class="standalone-title">Mari buat sesuatu yang <span>keren</span>.</h1>
          <p>Butuh website, API, atau aplikasi fullstack? Kirim pesan dan saya akan menghubungi Anda kembali.</p>
          <div class="contact-links">
            <a href="https://github.com/muhjund1" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href="https://www.linkedin.com/in/muhammad-jundi-al-aqsha-462029403/" target="_blank" rel="noreferrer">LinkedIn ↗</a>
            <a href="https://x.com/" target="_blank" rel="noreferrer">X / Twitter ↗</a>
            <a href="https://instagram.com/muh_jund1" target="_blank" rel="noreferrer">Instagram ↗</a>
          </div>
        </div>
        <form class="contact-form reveal" id="contact-form">
          <div class="form-row">
            <label>Nama<input name="name" type="text" required placeholder="Nama Anda"></label>
            <label>Email<input name="email" type="email" required placeholder="email@example.com"></label>
          </div>
          <label>Subjek<input name="subject" type="text" required placeholder="Tentang apa?"></label>
          <label>Pesan<textarea name="message" rows="6" required minlength="10" placeholder="Tulis pesan Anda..."></textarea></label>
          <button class="btn btn-primary" type="submit" id="contact-submit">Kirim Pesan <span>→</span></button>
          <p id="contact-message" class="form-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
